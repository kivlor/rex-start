[package]
name = "rex-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rex-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }
rex-conn = { path = "../rex-conn" }
rex-terminal = { path = "../rex-terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = "0.28"
